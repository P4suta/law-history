name: Check
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions: {}
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.2
      - name: Install Web dependencies
        run: mise x -- npm ci --prefix web --ignore-scripts
      - name: Install Chromium
        run: mise x -- npm exec --prefix web -- playwright install --with-deps chromium
      - name: Check workflow definitions
        run: |
          mise x -- actionlint
          mise x -- zizmor --offline --strict-collection --persona pedantic .github/workflows
      - name: Verify history workflows
        run: mise x -- just check
