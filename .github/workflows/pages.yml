name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    name: Build browser application
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.11.2
      - name: Install Web dependencies
        run: mise x -- npm ci --prefix web --ignore-scripts
      - name: Build the browser application
        run: mise x -- just pages
      - name: Upload the static website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: web/dist-pages
  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # Create the Pages deployment for the built artifact.
      id-token: write # Authenticate the deployment with GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the website
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
